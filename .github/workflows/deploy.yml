name: 部署到 GitHub Pages

# 每次推送到 main 分支自动构建并发布；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        # 用 npm install 而非 npm ci：lock 文件在 Windows 生成，
        # 缺少 Linux 原生包 @rollup/rollup-linux-x64-gnu，npm ci 会导致构建失败。
        run: npm install --no-audit --no-fund

      - name: 构建生产版本
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "::warning::BUILD_EXIT=$code LOG=$(tr '\n' ' ' < /tmp/build.log | head -c 2000)"
          exit $code

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
