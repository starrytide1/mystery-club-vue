name: 部署到 GitHub Pages

# 每次推送到 main 分支自动构建并发布；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 诊断环境
        run: |
          echo "::notice::NODE=$(node -v) NPM=$(npm -v)"
          echo "::notice::ROOTFILES=$(ls | tr '\n' ' ')"
          echo "::notice::LOCK_BYTES=$(wc -c < package-lock.json)"
          echo "::notice::VITE_EXISTS=$(test -f node_modules/.bin/vite && echo yes || echo no)"
          echo "::notice::PKG=$(tr -d '\n' < package.json)"

      - name: 构建生产版本
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
